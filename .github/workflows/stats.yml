name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout repository
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==============================
      # Generate GitHub Stats
      # ==============================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github
          path: profile/stats.svg
          token: ${{ github.token }}


      # ==============================
      # Generate Top Languages
      # ==============================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ github.token }}


      # ==============================
      # Generate Contribution Card
      # ==============================

      - name: Generate Contribution Statistics
        uses: shinpr/github-profile-stats@v0.2.0
        id: contributions
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency


      # ==============================
      # Copy Contribution Cards
      # ==============================

      - name: Copy contribution cards
        env:
          READY_DIR: ${{ steps.contributions.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$READY_DIR"/activity-consistency-*.svg profile/

          test -s profile/activity-consistency-wide-light.svg
          test -s profile/activity-consistency-wide-dark.svg
          test -s profile/activity-consistency-compact-light.svg
          test -s profile/activity-consistency-compact-dark.svg


      # ==============================
      # Commit everything
      # ==============================

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile stats"
            git push
          fi
